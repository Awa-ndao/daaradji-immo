<main class="login">

  <!-- Panneau marque : la ligne de toit du logo, en grand -->
  <section class="brand">
    <svg class="roof" viewBox="0 0 600 260" fill="none" aria-hidden="true">
      <path class="roof__line" pathLength="1"
            d="M10 236 L128 180 L128 132 L176 132 L176 156 L306 82 L452 170" />
      <path class="roof__line roof__line--second" pathLength="1"
            d="M356 82 L536 186 L1000 186" />
      <g class="roof__window">
        <rect x="284" y="138" width="20" height="20" />
        <rect x="310" y="138" width="20" height="20" />
        <rect x="284" y="164" width="20" height="20" />
        <rect x="310" y="164" width="20" height="20" />
      </g>
    </svg>

    <div class="brand__text">
      <h2 class="brand__title">Bienvenue sur l'espace de gestion de <span class="brand__name">DAARADJI IMMO</span></h2>
      <p class="brand__lead">
        Biens, clients, contrats et paiements : tout le travail de l'équipe au même endroit.
      </p>
      <ul class="brand__services">
        <li>Achat</li>
        <li>Vente</li>
        <li>Location</li>
        <li>Construction</li>
      </ul>
    </div>
  </section>

  <!-- Panneau connexion -->
  <section class="panel">
    <div class="panel__inner">
      <img class="panel__logo" src="/images/logo.png" alt="DAARADJI IMMO" />

      <h1 class="panel__title">Connexion</h1>
      <p class="panel__lead">Entrez vos identifiants pour continuer.</p>
      <form class="form" (ngSubmit)="onLogin()" novalidate>

        <p class="form__error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

        <label class="field">
          <span class="field__label">Adresse e-mail</span>
          <input class="field__input" type="email" name="email" [(ngModel)]="email"
                 placeholder="prenom@daaradji.sn" autocomplete="username" required />
        </label>

        <label class="field">
          <span class="field__label">Mot de passe</span>
          <span class="field__group">
            <input class="field__input" [type]="showPassword ? 'text' : 'password'" name="password"
                   [(ngModel)]="password" autocomplete="current-password" required />
            <button class="field__toggle" type="button" (click)="showPassword = !showPassword"
                    [attr.aria-pressed]="showPassword"
                    [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" width="22" height="22" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" width="22" height="22" fill="none"
                   stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3 3.9" />
                <path d="M6.5 6.6C3.6 8.5 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.3-1.5" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                <path d="M3 3l18 18" />
              </svg>
            </button>
          </span>
        </label>

        <a class="form__forgot" href="#">Mot de passe oublié ?</a>

        <button class="form__submit" type="submit" [disabled]="loading">
          {{ loading ? 'Connexion en cours…' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </section>

</main>
